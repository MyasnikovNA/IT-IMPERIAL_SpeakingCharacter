<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Тренировка — Говорящий аватар</title><link rel="stylesheet" href="/style.css?v=2"></head>
<body><main class="container training-page"><section class="training-card">
    <a class="back-link" href="/?v=2">← Выбрать сценарий для новой тренировки</a><h1>Говорящий аватар</h1><p class="training-scenario" id="training-scenario">Свободный диалог</p>
    <video id="avatar" autoplay playsinline></video><audio id="avatar-audio" autoplay hidden></audio>
    <textarea id="text" placeholder="Введите сообщение для аватара…">Привет! Это мой говорящий аватар.</textarea>
    <div class="buttons"><button id="connect">Подключить</button><button id="speak" disabled>Говорить</button><button id="disconnect" disabled>Отключить</button></div><div id="status">Загрузка…</div>
</section></main><script type="module" src="/app.js?v=8"></script></body></html>
