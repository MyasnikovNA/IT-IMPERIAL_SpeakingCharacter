# Локальный экземпляр PostgreSQL для Kotlin backend чата.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speaking_character}
      POSTGRES_USER: ${POSTGRES_USER:-speaking_character}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speaking_character}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
