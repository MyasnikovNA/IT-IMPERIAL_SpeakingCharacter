<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Говорящий аватар</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="about-button" href="/about.html">О приложении</a>
<main class="start-page">
    <div class="start-page__content">
        <p class="eyebrow">IMPERIAL SPEAKING CHARACTER</p>
        <h1>Говорящий аватар</h1>
        <p class="service-description">Практикуйте деловые диалоги с виртуальным собеседником и развивайте уверенность в разговоре.</p>
        <label class="scenario-upload" for="scenario-file">
            <span class="scenario-upload__icon" aria-hidden="true">↑</span>
            <span class="scenario-upload__title">Загрузите сценарий тренировки</span>
            <span class="scenario-upload__hint" id="scenario-file-name">PDF, DOCX или TXT</span>
            <input id="scenario-file" type="file" accept=".pdf,.doc,.docx,.txt,.md">
        </label>
        <a class="start-button" href="/training.html">Начать тренировку</a>
    </div>
</main>
</body>
</html>
